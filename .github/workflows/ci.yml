name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest
    env:
      # SQL Server integration tests fail (rather than skip) if Docker is unavailable.
      FIELDAPP_REQUIRE_DOCKER: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore FieldApp.sln
          dotnet tool restore

      - name: Verify formatting
        run: dotnet format FieldApp.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build FieldApp.sln --configuration Release --no-restore

      - name: Unit and integration tests
        run: dotnet test --solution FieldApp.sln --configuration Release --no-build

      - name: EF Core model has no unmigrated changes
        run: dotnet ef migrations has-pending-model-changes --project src/FieldApp.Infrastructure --startup-project src/FieldApp.Infrastructure --configuration Release --no-build

      - name: Generate idempotent migration script for review
        run: dotnet ef migrations script --idempotent --project src/FieldApp.Infrastructure --startup-project src/FieldApp.Infrastructure --configuration Release --no-build --output artifacts/migrations.sql

      - uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: artifacts/migrations.sql

  frontend:
    name: Web typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FieldApp.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FieldApp.Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  container:
    name: Production image and seeded end-to-end tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag fieldapp:${{ github.sha }} .

      - name: Smoke test the production image alone (no database, Production environment)
        run: |
          docker run --detach --name fieldapp --publish 8081:8080 fieldapp:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8081/health/live
          echo
          # Without a database the instance is live but must not report ready.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/health/ready)" = "503"
          # The compiled SPA is served from the same origin.
          curl --fail --silent --show-error http://localhost:8081/ | grep --quiet '<div id="root"></div>'
          # Development persona authentication is not available in Production.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-Dev-Persona: administrator' http://localhost:8081/api/v1/projects)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8081/api/v1/dev/personas)" = "404"
          docker stop fieldapp

      - name: Start Compose (SQL Server, migrate with synthetic seed, app)
        run: |
          echo "FIELDAPP_SQL_PASSWORD=Ci-$(openssl rand -hex 16)-Aa1!" > .env
          docker compose up --build --detach --wait app
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health/ready)" = "200"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Playwright tests at 360px with axe accessibility checks
        env:
          FIELDAPP_E2E_BASE_URL: http://localhost:8080
        run: |
          dotnet build tests/FieldApp.E2ETests --configuration Release
          pwsh tests/FieldApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          dotnet test --project tests/FieldApp.E2ETests --configuration Release --no-build

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
