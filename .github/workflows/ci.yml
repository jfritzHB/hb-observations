name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest
    env:
      # SQL Server integration tests fail (rather than skip) if Docker is unavailable.
      FIELDAPP_REQUIRE_DOCKER: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FieldApp.sln

      - name: Verify formatting
        run: dotnet format FieldApp.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build FieldApp.sln --configuration Release --no-restore

      - name: Unit and integration tests
        run: dotnet test --solution FieldApp.sln --configuration Release --no-build

  frontend:
    name: Web typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FieldApp.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FieldApp.Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  container:
    name: Production image smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag fieldapp:${{ github.sha }} .

      - name: Start container (no database)
        run: docker run --detach --name fieldapp --publish 8080:8080 fieldapp:${{ github.sha }}

      - name: Smoke test health endpoints
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8080/health/live
          echo
          # Without a database the instance is live but must not report ready.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/health/ready)
          test "$status" = "503"
          # The compiled SPA is served from the same origin.
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<div id="root"></div>'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Browser smoke test at phone viewport
        env:
          FIELDAPP_E2E_BASE_URL: http://localhost:8080
        run: |
          dotnet build tests/FieldApp.E2ETests --configuration Release
          pwsh tests/FieldApp.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          dotnet test --project tests/FieldApp.E2ETests --configuration Release --no-build

      - name: Container logs
        if: always()
        run: docker logs fieldapp
